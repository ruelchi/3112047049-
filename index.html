<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>心情轉換器</title>
    <style>
    
        #colorBox {
            margin: 20px 0;
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            transition: background-color 0.5s ease;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h2 id="moodTitle">今天心情如何？</h2> 

    <div id="colorBox"> 
        <span id="moodEmoji" style="font-size: 50px;">😶</span> 
    </div> 

    <div class="actions">
        <button id="happyBtn">開心</button> 
        <button id="sadBtn">憂鬱</button> 
        <button id="resetBtn">恢復原狀</button> 
    </div>

    <script src="bulb.js"></script>
</body>
</html>
